<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevSnapKit - Studio-Grade Screenshot Mockups & Social Cards in Seconds</title>
    <meta name="description" content="Create professional product mockups, feature changelogs, and social media graphics without opening Figma. 100% private in-browser processing, zero server uploads, 32+ luxury studio palettes, 4K lossless exports." />
    <link rel="canonical" href="https://devsnapkit.com/" />
    
    <!-- OpenGraph Metadata -->
    <meta property="og:title" content="DevSnapKit - Studio-Grade Screenshot Mockups & Social Cards in Seconds" />
    <meta property="og:description" content="Transform raw screenshots into high-converting product mockups, launch graphics, and social assets in seconds. 100% private in-browser processing, zero server uploads." />
    <meta property="og:url" content="https://devsnapkit.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://devsnapkit.com/og-image.png" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta property="og:site_name" content="DevSnapKit" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DevSnapKit - Studio-Grade Screenshot Mockups & Social Cards in Seconds" />
    <meta name="twitter:description" content="Transform raw screenshots into high-converting product mockups, launch graphics, and social assets in seconds. 100% private in-browser processing, zero server uploads." />
    <meta name="twitter:image" content="https://devsnapkit.com/og-image.png" />

    <!-- Google Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- JSON-LD Structured Data for Google Rich Snippets -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "DevSnapKit Studio",
      "url": "https://devsnapkit.com/",
      "description": "Studio-grade browser-based screenshot beautifier and social media card creator for content creators, marketers, founders, and designers.",
      "applicationCategory": "DesignApplication",
      "operatingSystem": "All",
      "offers": {
        "@type": "Offer",
        "price": "1.00",
        "priceCurrency": "USD",
        "availability": "https://schema.org/InStock",
        "priceValidUntil": "2027-12-31"
      },
      "creator": {
        "@type": "Person",
        "name": "DevSnapKit Studio",
        "email": "support@devsnapkit.com"
      }
    }
    </script>
    <!-- Theme Initializer (Default Light, user-toggleable) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('shotcraft_theme_mode');
          var mode = (saved === 'dark') ? 'dark' : 'light';
          document.documentElement.classList.add('theme-' + mode);
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="theme-light antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <nav aria-label="Screenshot tools" style="padding:10px 16px;text-align:center;font-size:12px;background:#f7f8f4;color:#475569;">
      <a href="/screenshot-beautifier/">Explore the screenshot beautifier ↗</a>
    </nav>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
